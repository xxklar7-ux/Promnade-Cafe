<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMNADE CAFE</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root { --gold:#d4af37; --black:#080808; --card-bg:#1a1a1a; }
body { background:var(--black); color:white; font-family:Cairo; margin:0; padding-bottom:140px; }

header { text-align:center; padding:30px; }
.brand-name { font-size:2rem; color:var(--gold); }

.container { padding:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:15px; }

.card { background:var(--card-bg); padding:10px; border-radius:10px; text-align:center; }
.item-img { width:100%; height:120px; object-fit:cover; border-radius:10px; }

.cart-bar { position:fixed; bottom:0; width:100%; background:#111; padding:10px; display:flex; justify-content:space-between; }

#toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); display:none; background:#000; padding:10px; border:1px solid gold; }
input { padding:10px; margin-bottom:10px; width:80%; border-radius:8px; border:none; }
button { padding:10px; margin:5px; cursor:pointer; border:none; border-radius:8px; }
</style>
</head>

<body>

<header>
<h1 class="brand-name">PROMNADE CAFE</h1>
<input id="search" placeholder="🔍 بحث">
</header>

<div class="container">
<div class="grid" id="grid"></div>
</div>

<div class="cart-bar">
<div id="total">0 EGP</div>
<button onclick="openOrder()">تأكيد (<span id="count">0</span>)</button>
</div>

<div id="toast">✔ تمت الإضافة</div>

<script>
const delivery = 5;
let items = [];
let cart = {};

async function loadItems(){
const res = await fetch("https://your-server-url.onrender.com/items");
items = await res.json();
render();
}

function render(){
const grid = document.getElementById("grid");
grid.innerHTML = "";
const s = document.getElementById("search").value;

items.forEach(i=>{
if(!i.name.includes(s)) return;
const q = cart[i.name]?.qty || 0;
grid.innerHTML += `
<div class="card">
<img src="${i.img}" class="item-img">
<div>${i.name}</div>
<div>${i.price} ج</div>
<button onclick="update('${i.name}',1,${i.price})">+</button>
<span>${q}</span>
<button onclick="update('${i.name}',-1,${i.price})">-</button>
</div>`;
});
}

function update(n,d,p){
if(!cart[n]) cart[n]={qty:0,price:p};
cart[n].qty+=d;
if(cart[n].qty<0) cart[n].qty=0;
calc();
render();
toast("✔ تمت الإضافة");
}

function calc(){
let t=0,c=0;
for(let k in cart){
t+=cart[k].qty*cart[k].price;
c+=cart[k].qty;
}
t = t ? t + delivery : 0;
total.innerText = t+" EGP";
count.innerText = c;
}

function toast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

async function openOrder(){
if(Object.keys(cart).length==0) return alert("السلة فاضية");

let totalPrice=0;
for(let k in cart) totalPrice += cart[k].qty * cart[k].price;

await fetch("https://your-server-url.onrender.com/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({cart,total:totalPrice})
});

alert("تم الطلب ✅");
cart={};
render();
calc();
}

search.addEventListener("input",render);
loadItems();
calc();

/* PWA */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
