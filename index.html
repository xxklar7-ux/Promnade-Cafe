<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMNADE CAFE | VIP Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --black: #080808; --card-bg: #1a1a1a; --gray: #aaa; }
        body { background-color: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; padding-bottom: 140px; }
        
        /* الهيدر والعنوان */
        header { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #151515, transparent); border-bottom: 1px solid #222; }
        .brand-name { font-size: 3rem; font-weight: 900; color: var(--gold); margin: 0; letter-spacing: 2px; }
        .location-tag { color: var(--gray); font-size: 1.1rem; margin-top: 5px; }
        .location-tag b { color: var(--gold); }

        /* تنسيق الشبكة العريضة */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .section-title { border-right: 6px solid var(--gold); padding-right: 15px; margin: 50px 0 25px; font-size: 1.8rem; color: var(--gold); font-weight: 900; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        /* كارت المنتج المطور */
        .card { background: var(--card-bg); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #333; transition: 0.3s ease-in-out; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--gold); transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .item-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; background: #222; }
        .item-name { font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; height: 55px; display: flex; align-items: center; justify-content: center; }
        .price { color: var(--gold); font-weight: 900; font-size: 1.4rem; margin-bottom: 15px; }
        .unavailable { color: #555; font-size: 0.9rem; padding: 20px 0; font-weight: bold; }

        /* التحكم بالكمية */
        .qty-box { display: flex; align-items: center; justify-content: space-between; background: #000; border-radius: 10px; padding: 5px 15px; border: 1px solid #333; }
        .qty-btn { background: var(--gold); border: none; color: black; width: 35px; height: 35px; border-radius: 8px; font-weight: 900; font-size: 1.4rem; cursor: pointer; }
        .qty-val { font-weight: 900; font-size: 1.2rem; color: white; }

        /* بار الحساب السفلي */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f0f; padding: 20px 40px; border-top: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); }
        .total-info { line-height: 1.4; }
        .delivery-text { font-size: 0.9rem; color: #00ff44; font-weight: bold; }
        .total-amount { font-size: 2rem; font-weight: 900; color: var(--gold); }
        .order-trigger { background: var(--gold); color: black; padding: 15px 45px; border-radius: 12px; font-weight: 900; border: none; cursor: pointer; font-size: 1.3rem; transition: 0.3s; }
        .order-trigger:hover { background: white; transform: scale(1.05); }

        /* مودال العنوان */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #151515; padding: 30px; border-radius: 25px; border: 2px solid var(--gold); width: 100%; max-width: 450px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 10px; font-family: 'Cairo'; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }

        @media (max-width: 600px) {
            .brand-name { font-size: 2rem; }
            .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .item-img { height: 120px; }
            .cart-bar { padding: 15px; flex-direction: column; gap: 15px; }
            .order-trigger { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <h1 class="brand-name">PROMNADE CAFE</h1>
    <p class="location-tag">📍 <b>الشيخ زايد</b> - بجوار الخمائل</p>
</header>

<div class="container">
    <div class="section-title">🥦 قسم الخضروات المجهزة</div>
    <div class="grid" id="veg-grid"></div>

    <div class="section-title">🍎 فاكهة الموسم الطازجة</div>
    <div class="grid" id="fruit-grid"></div>

    <div class="section-title">🥤 الماركت والكافيه</div>
    <div class="grid" id="market-grid"></div>
</div>

<div class="cart-bar">
    <div class="total-info">
        <span class="delivery-text">توصيل: 5ج (مضاف)</span><br>
        <span class="total-amount" id="total-val">5 EGP</span>
    </div>
    <button class="order-trigger" onclick="openOrderModal()">تأكيد الطلب الآن ✨</button>
</div>

<div class="modal" id="orderModal">
    <div class="modal-content">
        <h2 style="color:var(--gold); margin-bottom:20px;">بيانات التوصيل 🛵</h2>
        <input type="text" id="cust-name" placeholder="الاسم بالكامل">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <input type="number" id="cust-build" placeholder="عمارة">
            <input type="number" id="cust-floor" placeholder="دور">
            <input type="number" id="cust-flat" placeholder="شقة">
        </div>
        <input type="text" id="cust-phone" placeholder="رقم الموبايل">
        <button style="width:100%; background:var(--gold); color:black; padding:18px; border:none; border-radius:12px; font-weight:900; margin-top:20px; cursor:pointer; font-size: 1.2rem;" onclick="sendToWhatsApp()">إرسال للواتساب ✅</button>
        <button style="width:100%; background:none; color:var(--gray); border:none; margin-top:15px; cursor:pointer;" onclick="document.getElementById('orderModal').style.display='none'">إلغاء</button>
    </div>
</div>

<script>
    const deliveryFee = 5;
    
    const vegetables = [
        {name:"طماطم", price:30, img: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400"},
        {name:"بصل ابيض", price:17.5, img: "https://images.unsplash.com/photo-1580013759032-c96505e24c1f?w=400"},
        {name:"بصل احمر", price:20, img: "https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=400"},
        {name:"بطاطس تحمير", price:20, img: "https://images.unsplash.com/photo-1518977676601-b53f02bad675?w=400"},
        {name:"خيار", price:25, img: "https://images.unsplash.com/photo-1449333254714-23ee85ff47ed?w=400"},
        {name:"جزر", price:25, img: "https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=400"},
        {name:"ثوم مفصص (½ كيلو)", price:45, img: "https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?w=400"},
        {name:"فلفل الوان", price:70, img: "https://images.unsplash.com/photo-1563565375-f3fdfdbfeb83?w=400"},
        {name:"فلفل رومى", price:45, img: "https://images.unsplash.com/photo-1594213110243-7f722359ba7c?w=400"},
        {name:"فلفل حامى", price:40, img: "https://images.unsplash.com/photo-1588253510218-472d82999086?w=400"},
        {name:"ليمون", price:40, img: "https://images.unsplash.com/photo-1590505682634-ad216644ef23?w=400"},
        {name:"كوسة", price:30, img: "https://images.unsplash.com/photo-1599307767316-776533da941c?w=400"},
        {name:"بسلة بالجزر", price:45, img: "https://images.unsplash.com/photo-1592394533824-9440e5d68530?w=400"},
        {name:"½ باذنجان متقور", price:45, img: "https://images.unsplash.com/photo-1628554270682-5369679f115d?w=400"},
        {name:"شوربة خضار", price:35, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400"},
        {name:"سبانخ", price:0, img: "https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=400"},
        {name:"بنجر", price:0, img: "https://images.unsplash.com/photo-1593105544230-cd02d07bb27a?w=400"}
    ];

    const fruits = [
        {name:"تفاح احمر سكرى", price:75, img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6bcd6?w=400"},
        {name:"موز", price:35, img: "https://images.unsplash.com/photo-1571771894821-ad9b58866602?w=400"},
        {name:"يوسفى موركت", price:25, img: "https://images.unsplash.com/photo-1557800636-894a64c1696f?w=400"},
        {name:"فراولة", price:35, img: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400"},
        {name:"جوافة سكرى", price:30, img: "https://images.unsplash.com/photo-1614332287897-cdc485fa562d?w=400"},
        {name:"برتقال بصرة", price:25, img: "https://images.unsplash.com/photo-1547514701-42782101795e?w=400"}
    ];

    const marketCafe = [
        {name:"V Cola (في كولا)", price:25, img: "https://images.unsplash.com/photo-1622483767028-3f66f344556c?w=400"},
        {name:"مياه معدنية", price:10, img: "https://images.unsplash.com/photo-1523362628745-0c100150b504?w=400"},
        {name:"لبن جهينة (1 لتر)", price:45, img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400"},
        {name:"أرز معبأ (1 كيلو)", price:35, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
        {name:"ايس كريم اوريو", price:25, img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400"},
        {name:"ايس كريم ميجا", price:25, img: "https://images.unsplash.com/photo-1561845730-2283999114d7?w=400"},
        {name:"قهوة تركي", price:35, img: "https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=400"},
        {name:"شاي عراقي", price:15, img: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=400"}
    ];

    let cart = {}; let total = 0;

    function renderItems(items, containerId) {
        const container = document.getElementById(containerId);
        items.forEach(item => {
            const card = document.createElement('div'); card.className = 'card';
            let content = `<img src="${item.img}" class="item-img" alt="${item.name}"><span class="item-name">${item.name}</span>`;
            if(item.price > 0) {
                content += `<span class="price">${item.price} ج</span><div class="qty-box"><button class="qty-btn" onclick="updateQty('${item.name}', -1, ${item.price})">-</button><span id="q-${item.name}" class="qty-val">0</span><button class="qty-btn" onclick="updateQty('${item.name}', 1, ${item.price})">+</button></div>`;
            } else { content += `<span class="unavailable">غير متوفر اليوم</span>`; }
            card.innerHTML = content; container.appendChild(card);
        });
    }

    renderItems(vegetables, 'veg-grid'); renderItems(fruits, 'fruit-grid'); renderItems(marketCafe, 'market-grid');

    function updateQty(name, delta, price) {
        if(!cart[name]) cart[name] = {qty: 0, price: price};
        cart[name].qty += delta; if(cart[name].qty < 0) cart[name].qty = 0;
        document.getElementById(`q-${name}`).innerText = cart[name].qty; calculateTotal();
    }

    function calculateTotal() {
        let subtotal = 0; for(let k in cart) subtotal += cart[k].qty * cart[k].price;
        total = subtotal > 0 ? subtotal + deliveryFee : 0;
        document.getElementById('total-val').innerText = (subtotal > 0 ? total : 0) + " EGP";
    }

    function openOrderModal() { if(total === 0) return alert("سلتك فارغة!"); document.getElementById('orderModal').style.display = 'flex'; }

    function sendToWhatsApp() {
        const n = document.getElementById('cust-name').value, b = document.getElementById('cust-build').value, f = document.getElementById('cust-floor').value, s = document.getElementById('cust-flat').value, p = document.getElementById('cust-phone').value;
        if(!n || !b || !f || !s) return alert("يرجى إكمال بيانات العنوان!");
        let itemsList = ""; for(let k in cart) if(cart[k].qty > 0) itemsList += `%0A- ${k} (${cart[k].qty})`;
        const fullMsg = `✨ *طلب جديد - PROMNADE* ✨%0A%0A📦 *الأصناف:* ${itemsList}%0A%0A💵 *الإجمالي + التوصيل:* ${total} EGP%0A%0A👤 *العميل:* ${n}%0A🏠 *العنوان:* عمارة ${b} | دور ${f} | شقة ${s}%0A📍 *الموقع:* الشيخ زايد - بجوار الخمائل%0A📞 *هاتف:* ${p}`;
        window.open(`https://wa.me/201558124828?text=${fullMsg}`);
    }
</script>
</body>
</html>
